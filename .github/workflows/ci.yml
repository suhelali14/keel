name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Three operating systems because one of the bugs this repo exists for is
    # Windows-only: Chrome cannot open a window narrower than ~494px there, and
    # a check that only ever runs on Linux would never meet it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
